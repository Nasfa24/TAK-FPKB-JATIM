<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - TAK FPKB DPRD Jatim</title>
  <meta name="theme-color" content="#059669">
  
  <!-- Tailwind & SweetAlert -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    tailwind.config = { theme: { extend: { colors: { pkb: { light: '#34d399', DEFAULT: '#059669', dark: '#047857' } } } } }
  </script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm mx-4 border-t-4 border-pkb relative">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800">Tenaga Ahli Kedewanan</h1>
      <p class="text-sm text-gray-500">FPKB DPRD Provinsi Jawa Timur</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pkb focus:border-pkb outline-none transition" autocomplete="off">
      </div>
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pkb focus:border-pkb outline-none transition">
      </div>
      <button type="submit" id="btnSubmit" class="w-full bg-pkb text-white font-semibold py-2 px-4 rounded-lg hover:bg-pkb-dark transition duration-200 flex justify-center items-center">
        <span>Masuk</span>
      </button>
    </form>

    <!-- UTILITY FOOTER: Refresh & Clear Cache (Self-Healing UI) -->
    <div class="mt-6 pt-4 border-t border-gray-100 flex justify-between items-center text-xs">
      <button type="button" onclick="window.location.reload(true)" class="text-gray-500 hover:text-pkb flex items-center transition group">
        <svg class="w-4 h-4 mr-1 group-hover:rotate-180 transition duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Refresh
      </button>
      <button type="button" onclick="handleClearCache()" class="text-gray-500 hover:text-red-500 flex items-center transition">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        Clear Cache
      </button>
    </div>
  </div>

  <script>
    // KONFIGURASI FIREBASE MURNI
    const firebaseConfig = {
      apiKey: "AIzaSyAeiiF06uIkuRJuEELSORGYriC4LZIWAzo",
      authDomain: "apps-tak-fpkb.firebaseapp.com",
      projectId: "apps-tak-fpkb",
      storageBucket: "apps-tak-fpkb.firebasestorage.app",
      messagingSenderId: "370368024191",
      appId: "1:370368024191:web:ece099f60a9064a968394a"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // CEK SESI: Direct Routing
    document.addEventListener("DOMContentLoaded", function() {
      let savedUser = localStorage.getItem('tak_username');
      let savedRole = localStorage.getItem('tak_role');
      
      if (savedUser) {
        let role = (savedRole || "").toLowerCase();
        let pageTarget = 'dashboard_tak.html'; 
        
        if (role.includes('koordinator')) pageTarget = 'dashboard_koordinator.html';
        else if (role.includes('bendahara')) pageTarget = 'dashboard_bendahara.html';
        
        window.location.href = pageTarget;
      }
    });

    // FUNGSI UTAMA: Login
    function handleLogin(event) {
      event.preventDefault(); 
      const btn = document.getElementById('btnSubmit');
      
      const user = document.getElementById('username').value.trim().toLowerCase();
      const pass = document.getElementById('password').value.trim();
      const emailFirebase = user + "@tak.fpkb.id";

      btn.innerHTML = `<svg class="animate-spin h-5 w-5 mr-3 text-white" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Memproses...`;
      btn.disabled = true;

      auth.signInWithEmailAndPassword(emailFirebase, pass)
        .then((userCredential) => {
          return db.collection("Users").doc(user).get();
        })
        .then((doc) => {
          if (doc.exists) {
            let userData = doc.data();
            
            localStorage.setItem('tak_username', userData.username);
            localStorage.setItem('tak_role', userData.role);
            localStorage.setItem('tak_nama', userData.nama);
            localStorage.setItem('tak_dewan', userData.dewan);
            localStorage.setItem('tak_poin', userData.poin);

            btn.innerHTML = `Mengalihkan...`;
            
            let role = (userData.role || "").toString().toLowerCase();
            let pageTarget = 'dashboard_tak.html'; 
            
            if (role.includes('koordinator')) pageTarget = 'dashboard_koordinator.html';
            else if (role.includes('bendahara')) pageTarget = 'dashboard_bendahara.html';
            
            window.location.href = pageTarget;

          } else {
            throw new Error("Data Profil tidak ditemukan di Firestore Database.");
          }
        })
        .catch((error) => {
          btn.innerHTML = `Masuk`; 
          btn.disabled = false;
          
          let judulError = 'Akses Ditolak';
          let pesanError = error.message; 
          
          if (error.code === 'auth/network-request-failed') {
            pesanError = "Koneksi terputus ATAU Domain 'lebahindrapura.fun' belum didaftarkan di Firebase > Authentication > Settings > Authorized Domains.";
          } else if (error.code === 'auth/user-not-found') {
            pesanError = "Akun belum terdaftar di Firebase. Pastikan Anda sudah menjalankan fungsi 'injeksiDataKeFirebase' di Google Apps Script.";
          } else if (error.code === 'auth/wrong-password') {
            pesanError = "Password yang Anda masukkan salah.";
          }
          
          Swal.fire({ 
            icon: 'error', 
            title: judulError, 
            text: `${pesanError} (Kode Sistem: ${error.code || 'unknown'})`, 
            confirmButtonColor: '#059669' 
          });
        });
    }

    // FUNGSI SELF-HEALING: Clear Cache & Hard Reset
    function handleClearCache() {
      Swal.fire({
        title: 'Perbaiki Sistem?',
        text: "Ini akan membersihkan data sesi yang tersangkut dan memuat ulang aplikasi ke kondisi awal.",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#059669',
        cancelButtonColor: '#d33',
        confirmButtonText: 'Ya, Bersihkan',
        cancelButtonText: 'Batal'
      }).then((result) => {
        if (result.isConfirmed) {
          // 1. Sapu bersih seluruh local & session storage
          localStorage.clear();
          sessionStorage.clear();
          
          // 2. Paksa putus koneksi Firebase Auth (jika ada sesi hantu)
          if (auth.currentUser) {
            auth.signOut().then(() => executeReload());
          } else {
            executeReload();
          }
        }
      });
    }

    function executeReload() {
      Swal.fire({
        title: 'Sistem Bersih!',
        text: 'Memuat ulang halaman...',
        icon: 'success',
        timer: 1200,
        showConfirmButton: false
      }).then(() => {
        // Hard reload memaksa browser membuang cache lama
        window.location.reload(true);
      });
    }
  </script>
</body>
</html>
